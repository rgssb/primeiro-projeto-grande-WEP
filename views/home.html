<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Início</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=11">
</head>
<body>


    {{template "cabecalho"}}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-xs-12 col-sm-12 col-md-5 col-lg-5 col-xl-5">
                <!-- Conteúdo da coluna esquerda -->
                <h3>Nova Publicação</h3>
                <fieldset>
                    <form id="nova-publicacao">
                        <div class="form-group">
                            <label for="titulo-publicacao">Título</label>
                            <input type="text" class="form-control" id="titulo-publicacao" name="titulo" required="required" placeholder="Coloque o título da publicação">
                        </div>
                        <div class="form-group">
                            <label for="conteudo-publicacao">Conteúdo</label>
                            <textarea class="form-control" id="conteudo-publicacao" name="conteudo" required="required" placeholder="Escreva o conteúdo da publicação"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Publicar</button>
                    </form>
                </fieldset>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-7 col-lg-7 col-xl-7">
                <!-- Conteúdo da coluna direita -->
                 {{range .}}
              
                 <div class="jumbotron">
                <h1 class="display-4">{{.Titulo}}</h1>
                <p class="lead">{{.Conteudo}}</p>
                <a class="btn btn-primary btn-lg" href="#" role="button">Ver mais</a>
                <hr class="my-4">
                <p>Botoes</p>
                </div>                           
            
                {{end}}
            </div>
        </div>
    </div>

{{template "rodape"}}

{{template "scripts" }}

</body>
</html>
