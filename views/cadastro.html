<html lang="en">
<head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Usuário</title>
        <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">

        <link rel="stylesheet" type="text/css" href="/assets/css/login.css">
</head>
 <body>
 <div class="login-container">
        <div>
            <form class="Orby-form" id="form-cadastro">
                <div class="orby-mascot" id="orbyMascot" data-state="default" aria-hidden="true">
                    <div class="orby-glow"></div>
                    <div class="orby-inner">
                        <svg viewBox="0 0 120 120" width="72" height="72">
                            <defs>
                                <radialGradient id="orby-body-gradient" cx="34%" cy="28%" r="76%">
                                    <stop offset="0%" stop-color="#18234B"></stop>
                                    <stop offset="48%" stop-color="#070A16"></stop>
                                    <stop offset="100%" stop-color="#02030A"></stop>
                                </radialGradient>
                                <linearGradient id="orby-ring-gradient" x1="8" y1="60" x2="112" y2="60" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#8B5CF6"></stop>
                                    <stop offset="45%" stop-color="#6679FF"></stop>
                                    <stop offset="100%" stop-color="#B794F4"></stop>
                                </linearGradient>
                                <linearGradient id="orby-orbit-gradient" x1="60" y1="8" x2="60" y2="112" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#57D8FF"></stop>
                                    <stop offset="52%" stop-color="#35B9F4"></stop>
                                    <stop offset="100%" stop-color="#8B5CF6"></stop>
                                </linearGradient>
                                <filter id="orby-energy-texture" x="-20%" y="-20%" width="140%" height="140%">
                                    <feTurbulence type="fractalNoise" baseFrequency="0.08 0.18" numOctaves="2" seed="8" result="noise"></feTurbulence>
                                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
                                </filter>
                            </defs>
                            <path class="orby-ring orby-ring-back" filter="url(#orby-energy-texture)" d="M8 60 A52 15 0 0 1 112 60"></path>
                            <path class="orby-ring orby-ring-orbit orby-ring-orbit-back" filter="url(#orby-energy-texture)" d="M60 8 A17 52 0 0 1 60 112"></path>
                            <path class="orby-energy-wisp" d="M21 43 Q34 20 51 16"></path>
                            <path class="orby-energy-wisp orby-energy-wisp-alt" d="M77 102 Q96 91 102 72"></path>
                            <circle class="orby-body" fill="url(#orby-body-gradient)" cx="60" cy="60" r="33"></circle>
                            <circle class="orby-core-orbit" cx="60" cy="60" r="28"></circle>
                            <path class="orby-body-shine" d="M38 42 C44 29 57 24 69 28"></path>

                            <g class="orby-eye" id="orbyEyeL">
                                <circle class="orby-sclera" cx="47" cy="60" r="9"></circle>
                                <circle class="orby-pupil" cx="47" cy="60" r="4.4"></circle>
                                <circle class="orby-glint" cx="45" cy="57" r="1.3"></circle>
                                <path class="orby-lid orby-lid-happy" d="M39 61 Q47 55 55 61"></path>
                                <path class="orby-lid orby-lid-closed" d="M39 60 Q47 65 55 60"></path>
                                <path class="orby-lid orby-lid-worried" d="M39 57 Q47 62 55 58"></path>
                            </g>
                            <g class="orby-eye" id="orbyEyeR">
                                <circle class="orby-sclera" cx="73" cy="60" r="9"></circle>
                                <circle class="orby-pupil" cx="73" cy="60" r="4.4"></circle>
                                <circle class="orby-glint" cx="71" cy="57" r="1.3"></circle>
                                <path class="orby-lid orby-lid-happy" d="M65 61 Q73 55 81 61"></path>
                                <path class="orby-lid orby-lid-closed" d="M65 60 Q73 65 81 60"></path>
                                <path class="orby-lid orby-lid-worried" d="M65 58 Q73 62 81 57"></path>
                            </g>

                            <path class="orby-mouth orby-mouth-worried" d="M50 79 Q60 74 70 79"></path>
                            <path class="orby-mouth orby-mouth-smile" d="M51 77 Q60 83 69 77"></path>

                            <path class="orby-ring orby-ring-orbit orby-ring-orbit-front" filter="url(#orby-energy-texture)" d="M60 8 A17 52 0 0 0 60 112"></path>
                            <path class="orby-ring orby-ring-front" filter="url(#orby-energy-texture)" d="M8 60 A52 15 0 0 0 112 60"></path>
                            <circle class="orby-energy-node" cx="20" cy="67" r="1.8"></circle>
                            <circle class="orby-energy-node orby-energy-node-alt" cx="103" cy="56" r="1.8"></circle>
                        </svg>
                    </div>
                    <div class="orby-sparkles">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <span>Crie sua conta agora!</span>
                <div>
                    <input type="text" name="name" id="nome" placeholder="Digite o seu nome" required>
                </div>
                <div>
                    <input type="text" name="email" id="email" placeholder="Digite o seu email" required>
                </div>
                <div>
                    <input type="text" name="nick" id="nick" placeholder="Digite o seu nick" required>
                </div>
                <div>
                    <input type="password" name="senha" id="senha" placeholder="Digite a sua senha" required>
                </div>
                <div>
                    <input type="password" name="confirmar-senha" id="confirmar-senha" placeholder="Confirme a sua senha" required>
                </div>
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                <a href="/login">Clique aqui para realizar o Login</a>
                <button type="submit" class="btn-Orby">Cadastrar</button>
            </form>
        </div>

    <script src="/assets/js/orby-mascot.js"></script>
    <script src="/assets/js/jquery.js"></script> 
    <script src="/assets/js/cadastro.js"></script>
    </body>
</html>
