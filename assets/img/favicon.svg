<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#2f8cff"/>
    </linearGradient>
    <radialGradient id="body" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#26397a"/>
      <stop offset="0.55" stop-color="#0e1533"/>
      <stop offset="1" stop-color="#04050e"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
  </defs>

  <!-- brilho dos anéis (atrás) -->
  <g transform="rotate(-10 32 32)" fill="none">
    <ellipse cx="32" cy="32" rx="29.5" ry="9" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="7"/>
  </g>
  <g transform="rotate(22 32 32)" fill="none">
    <ellipse cx="32" cy="32" rx="12" ry="29.5" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="7"/>
  </g>
  <!-- anéis atrás do corpo -->
  <g transform="rotate(-10 32 32)" fill="none">
    <ellipse cx="32" cy="32" rx="29.5" ry="9" stroke="url(#ring)" stroke-width="3.2"/>
  </g>
  <g transform="rotate(22 32 32)" fill="none">
    <ellipse cx="32" cy="32" rx="12" ry="29.5" stroke="url(#ring)" stroke-width="3"/>
  </g>

  <!-- corpo -->
  <circle cx="32" cy="32" r="20.5" fill="url(#body)" stroke="#3d5fd6" stroke-width="1"/>

  <!-- anéis na frente -->
  <g transform="rotate(-10 32 32)" fill="none" stroke-linecap="round">
    <path d="M2.5 32 A29.5 9 0 0 0 61.5 32" stroke="url(#ring)" stroke-width="3.6"/>
  </g>
  <g transform="rotate(22 32 32)" fill="none" stroke-linecap="round">
    <path d="M32 2.5 A12 29.5 0 0 1 32 61.5" stroke="url(#ring)" stroke-width="3.4"/>
  </g>

  <!-- olhos -->
  <circle cx="24" cy="28.5" r="6" fill="#070b1f" stroke="#6ee7ff" stroke-width="1.7"/>
  <circle cx="39" cy="28.5" r="6" fill="#070b1f" stroke="#6ee7ff" stroke-width="1.7"/>
  <circle cx="24" cy="28.5" r="3.7" fill="url(#iris)"/>
  <circle cx="39" cy="28.5" r="3.7" fill="url(#iris)"/>
  <circle cx="25" cy="27.3" r="1" fill="#fff"/>
  <circle cx="40" cy="27.3" r="1" fill="#fff"/>

  <!-- partículas -->
  <circle cx="5" cy="43" r="1.6" fill="#fff"/>
  <circle cx="59" cy="19" r="1.3" fill="#6ee7ff"/>
</svg>
